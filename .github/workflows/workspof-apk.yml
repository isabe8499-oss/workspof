name: WorkSpoof APK de teste

on:
  push:
    branches: [harbor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Conferir checksums da dependência JSON no Maven Central
        run: |
          for extension in pom jar; do
            curl --fail --silent --show-error --location "https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.$extension" --output "$RUNNER_TEMP/json-20240303.$extension"
            sha256sum "$RUNNER_TEMP/json-20240303.$extension"
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Testar e compilar APK assinado para teste
        run: ./gradlew --no-daemon testDebugUnitTest :app:assembleDebug --write-locks
      - name: Verificar assinatura do APK
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WorkSpoof-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WorkSpoof-test-reports
          path: |
            **/build/reports/tests/**
            **/gradle.lockfile
